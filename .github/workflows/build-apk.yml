name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Create Cordova project
        run: |
          cordova create qiaoqiao com.qiaoqiao.pinyin "乔乔拼音"

      - name: Copy project files
        run: |
          cp config.xml qiaoqiao/
          cp -r www/* qiaoqiao/www/

      - name: Add Android platform
        run: |
          cd qiaoqiao
          cordova platform add android@13

      - name: Build APK
        run: |
          cd qiaoqiao
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qiaoqiao-pinyin-apk
          path: qiaoqiao/platforms/android/app/build/outputs/apk/debug/*.apk