name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Create Cordova project
        run: |
          cordova create qiaoqiao com.qiaoqiao.pinyin "乔乔拼音"

      - name: Copy project files
        run: |
          cp config.xml qiaoqiao/
          cp -r www/* qiaoqiao/www/

      - name: Add Android platform
        run: |
          cd qiaoqiao
          cordova platform add android@13

      - name: Replace MainActivity with TTS-enabled version
        run: |
          mkdir -p qiaoqiao/platforms/android/app/src/main/java/com/qiaoqiao/pinyin
          cp qiaoqiao-apk/app/src/main/java/com/qiaoqiao/pinyin/MainActivity.java qiaoqiao/platforms/android/app/src/main/java/com/qiaoqiao/pinyin/MainActivity.java
          echo "MainActivity.java replaced successfully"

      - name: Build APK
        run: |
          cd qiaoqiao
          cordova build android --debug --verbose

      - name: Find and copy APK
        run: |
          echo "=== Searching for APK ==="
          find qiaoqiao/platforms/android -name "*.apk" -type f
          echo "=== Copying APK ==="
          mkdir -p download
          cp qiaoqiao/platforms/android/app/build/outputs/apk/debug/*.apk download/qiaoqiao.apk || true
          ls -la download/ || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qiaoqiao-pinyin-apk
          path: qiaoqiao/platforms/android/app/build/outputs/apk/debug/*.apk
